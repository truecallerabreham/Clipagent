[project]
name = "clipagent-mcp"
version = "0.1.0"
description = "Video search and clip extraction MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.5.2",
    "pixeltable>=0.4.1",
    "openai>=1.91.0",
    "opik>=1.7.36",
    "sentence-transformers>=4.1.0",
    "transformers>=4.52.4",
    "moviepy>=2.2.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "groq>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipagent_mcp"]

[tool.ruff]
target-version = "py312"
