<!doctype html>
<html><head><meta charset="utf-8"><title>notebook</title>
<style>
  html,body{margin:0;height:100%;background:#0f1117;font-family:"Inter","DejaVu Sans",sans-serif;color:#d8dee9;overflow:hidden}
  .bar{height:52px;background:#171a22;display:flex;align-items:center;padding:0 22px;gap:10px;border-bottom:1px solid #232836}
  .dot{width:14px;height:14px;border-radius:50%}
  .title{margin-left:18px;color:#8a93a3;font-size:20px}
  .tabs{height:44px;background:#13161d;display:flex;align-items:flex-end;padding-left:20px;border-bottom:1px solid #232836}
  .tab{padding:10px 22px;font-size:18px;color:#8a93a3}
  .tab.on{color:#e6e9ef;background:#0f1117;border:1px solid #232836;border-bottom:none;border-radius:8px 8px 0 0}
  #nb{padding:28px 120px 0 120px}
  .cell{display:flex;gap:18px;margin-bottom:22px;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
  .cell.on{opacity:1;transform:none}
  .pr{width:92px;text-align:right;font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;font-size:20px;color:#5c6577;padding-top:16px}
  .box{flex:1;background:#161a23;border:1px solid #262c3a;border-radius:10px;padding:14px 20px;font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;font-size:25px;line-height:1.55;white-space:pre}
  .cell.active .box{border-color:#3f6fd8;box-shadow:0 0 0 1px #3f6fd8 inset}
  .out{flex:1;font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;font-size:24px;line-height:1.5;white-space:pre;color:#c9d1d9;padding:6px 20px}
  .md{flex:1;font-size:30px;font-weight:600;color:#e6e9ef;padding:6px 20px}
  .md small{display:block;font-size:20px;font-weight:400;color:#8a93a3;margin-top:4px}
  .k{color:#c678dd}.f{color:#61afef}.n{color:#d19a66}.s{color:#98c379}.c{color:#5c6577}.v{color:#e5c07b}
  .cur{display:inline-block;width:12px;height:28px;background:#61afef;vertical-align:-5px;animation:b 1s steps(1) infinite}
  @keyframes b{50%{opacity:0}}
  .spin{color:#e5c07b}
</style></head>
<body>
<div class="bar"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div><div class="title">linear-algebra-for-ml.ipynb — Jupyter</div></div>
<div class="tabs"><div class="tab on">linear-algebra-for-ml.ipynb</div><div class="tab">train.py</div></div>
<div id="nb">
  <div class="cell" id="m1"><div class="pr"></div><div class="md">1 · What does a matrix do to space?<small>numpy · matplotlib</small></div></div>
  <div class="cell" id="c1"><div class="pr">In [1]:</div><div class="box" id="c1t"></div></div>
  <div class="cell" id="o1"><div class="pr" style="color:#c46">Out[1]:</div><div class="out">array([[1, 1],
       [0, 1]])</div></div>
  <div class="cell" id="c2"><div class="pr">In [2]:</div><div class="box" id="c2t"></div></div>
  <div class="cell" id="o2"><div class="pr" style="color:#c46">Out[2]:</div><div class="out">array([3, 1])   <span class="c"># sheared to the right</span></div></div>
  <div class="cell" id="c3"><div class="pr" id="p3">In [3]:</div><div class="box" id="c3t"></div></div>
  <div class="cell" id="o3"><div class="pr" style="color:#c46"></div><div class="out" id="o3t"></div></div>
</div>
<script>
const code1 = '<span class="k">import</span> numpy <span class="k">as</span> np\nA = np.<span class="f">array</span>([[<span class="n">1</span>, <span class="n">1</span>],\n              [<span class="n">0</span>, <span class="n">1</span>]])   <span class="c"># columns: where î and ĵ land</span>\nA';
const code2 = 'v = np.<span class="f">array</span>([<span class="n">2</span>, <span class="n">1</span>])\nA <span class="k">@</span> v';
const code3 = '<span class="k">def</span> <span class="f">descend</span>(f_prime, x, lr=<span class="n">0.08</span>, steps=<span class="n">40</span>):\n    <span class="k">for</span> _ <span class="k">in</span> <span class="f">range</span>(steps):\n        x = x - lr * <span class="f">f_prime</span>(x)   <span class="c"># step downhill</span>\n    <span class="k">return</span> x\n\n<span class="f">descend</span>(<span class="k">lambda</span> x: x**<span class="n">3</span> - <span class="n">2.4</span>*x + <span class="n">0.6</span>, x=<span class="n">2.3</span>)';
function typeInto(el, html, cps, done){
  // type visible characters, keep tags intact
  const parts = html.split(/(<[^>]+>)/); let out = '', i = 0, j = 0;
  const tick = () => {
    if (i >= parts.length) { el.innerHTML = out; done && done(); return; }
    const p = parts[i];
    if (p.startsWith('<')) { out += p; i++; tick(); return; }
    if (j < p.length) { out += p[j++]; el.innerHTML = out + '<span class="cur"></span>'; setTimeout(tick, 1000 / cps); }
    else { i++; j = 0; tick(); }
  };
  tick();
}
const on = (id) => document.getElementById(id).classList.add('on');
const act = (id) => { document.querySelectorAll('.cell').forEach(c => c.classList.remove('active')); document.getElementById(id).classList.add('active'); };
const at = (s, fn) => setTimeout(fn, s * 1000);
at(0.4, () => on('m1'));
at(3.4, () => { on('c1'); act('c1'); typeInto(document.getElementById('c1t'), code1, 30); });
at(13.6, () => on('o1'));
at(14.4, () => { on('c2'); act('c2'); typeInto(document.getElementById('c2t'), code2, 22); });
at(18.6, () => on('o2'));
at(21.0, () => { document.getElementById('m1').style.display = 'none'; document.getElementById('c1').style.display = 'none'; document.getElementById('o1').style.display = 'none'; on('c3'); act('c3'); typeInto(document.getElementById('c3t'), code3, 45); });
at(28.6, () => { document.getElementById('p3').textContent = 'In [*]:'; on('o3'); document.getElementById('o3t').innerHTML = '<span class="spin">running… step 12/40</span>'; });
at(30.2, () => { document.getElementById('p3').textContent = 'In [3]:'; document.getElementById('o3t').innerHTML = '<span style="color:#c46">Out[3]:</span> 1.4046   <span class="c"># f\'(x) ≈ 0.000 → minimum</span>'; });
</script>
</body></html>
