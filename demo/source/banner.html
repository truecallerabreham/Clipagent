<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../../engine/clipagent/assets/fonts/Inter-Black.ttf);font-weight:900}
@font-face{font-family:Inter;src:url(../../engine/clipagent/assets/fonts/Inter-Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../../engine/clipagent/assets/fonts/Inter-SemiBold.ttf);font-weight:600}
html,body{margin:0;width:1600px;height:520px;overflow:hidden;background:#05060a;font-family:Inter}
.bg{position:absolute;inset:0;background:radial-gradient(900px 420px at 78% 40%,rgba(56,189,248,.16),transparent 60%),radial-gradient(700px 380px at 15% 90%,rgba(168,85,247,.16),transparent 60%),radial-gradient(500px 300px at 95% 100%,rgba(245,158,11,.10),transparent 60%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse at 60% 50%,black 30%,transparent 75%)}
.left{position:absolute;left:90px;top:120px}
.rec{display:inline-flex;align-items:center;gap:12px;padding:10px 20px;border-radius:999px;background:#16161a;border:1px solid #2a2a33;color:#e5e7eb;font-weight:600;font-size:22px}
.dot{width:14px;height:14px;border-radius:50%;background:#ef4444;box-shadow:0 0 18px #ef4444}
h1{margin:26px 0 0;font-size:112px;font-weight:900;letter-spacing:-4px;color:#fff;line-height:1}
h1 span{background:linear-gradient(90deg,#38BDF8,#A855F7 60%,#F59E0B);-webkit-background-clip:text;color:transparent}
p{margin:22px 0 0;font-size:30px;color:#a1a1aa;font-weight:500}
p b{color:#fff;font-weight:600}
svg{position:absolute;right:60px;top:60px}
</style></head><body><div class="bg"></div><div class="grid"></div>
