[project]
name = "clipagent"
version = "0.1.0"
description = "Talk freely, get a studio-edited video: the screen-recording engine behind the /screen-record coding-agent skill."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy",
  "opencv-python-headless>=4.9,<5",
  "faster-whisper>=1.1",
  "pydantic>=2",
  "playwright>=1.45",
  "pillow>=10",
]

[project.optional-dependencies]
manim = ["manim>=0.18"]

[project.scripts]
clipagent = "clipagent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
