<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>ClipAgent Recorder</title>
  <link rel="stylesheet" href="bar.css">
</head>
<body>
  <div class="bar" id="bar" data-status="starting">
    <span class="dot" aria-hidden="true"></span>
    <span class="time" id="time">00:00</span>
    <span class="meter" id="meter" title="Microphone level" aria-label="Microphone level">
      <i></i><i></i><i></i><i></i><i></i>
    </span>
    <span class="sep" aria-hidden="true"></span>
    <button class="btn" id="pause" title="Pause / resume (Ctrl+Alt+P)" aria-label="Pause">
      <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg>
      <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4a.8.8 0 0 0 1.2.7l8.4-5.2a.8.8 0 0 0 0-1.4L5.7 2.1a.8.8 0 0 0-1.2.7z"/></svg>
    </button>
    <button class="btn stop" id="stop" title="Stop (Ctrl+Alt+S)" aria-label="Stop">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2"/></svg>
    </button>
    <span class="toast" id="toast">Marked</span>
  </div>
  <script src="bar.js"></script>
</body>
</html>
